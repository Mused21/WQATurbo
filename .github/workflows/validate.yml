name: Validate addon

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate project structure
        run: python tools/validate_project.py

      - name: Check Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done < <(find . -type f -name '*.lua' -not -path './Libs/*' -not -path './.release/*' -print0)

      - name: Test tracking policy
        run: lua5.1 tools/test_tracking_policy.lua

      - name: Test reward classifier
        run: lua5.1 tools/test_reward_classifier.lua

      - name: Test reward scanner publication
        run: lua5.1 tools/test_reward_scanner.lua

      - name: Test runtime lifecycle
        run: lua5.1 tools/test_runtime_lifecycle.lua

      - name: Test task resolver
        run: lua5.1 tools/test_task_resolver.lua

      - name: Test custom editors
        run: lua5.1 tools/test_custom_options.lua

      - name: Test tooltip lifecycle
        run: lua5.1 tools/test_tooltip_lifecycle.lua

      - name: Build package with externals
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Validate packaged addon
        run: python tools/validate_project.py --package

      - name: Upload PR test build
        uses: actions/upload-artifact@v4
        with:
          name: WQATurbo-PR-${{ github.event.pull_request.number || github.run_number }}
          path: .release/WQATurbo-*.zip
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
