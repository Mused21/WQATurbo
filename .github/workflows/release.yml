name: Automatic release

on:
  push:
    branches: [master]

  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: wqaturbo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # For normal pushes, use the exact commit that triggered the workflow.
      # For a manual release, always release current master.
      #
      # This also makes "Re-run failed jobs" safe even if master moves later.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.sha }}

      - name: Determine release version
        id: version
        shell: bash
        env:
          MANUAL_BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"

          bump="patch"

          # ------------------------------------------------------------
          # Automatic release from a merged PR
          # ------------------------------------------------------------
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then

            pr_number="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                --jq '.[0].number // empty' \
                2>/dev/null || true
            )"

            # Do not automatically release arbitrary direct pushes.
            # Intentional releases without a PR can use workflow_dispatch.
            if [[ -z "$pr_number" ]]; then
              echo "No pull request associated with this push."
              echo "Skipping automatic release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Merged PR: #${pr_number}"

            labels="$(
              gh pr view "$pr_number" \
                --repo "$GITHUB_REPOSITORY" \
                --json labels \
                --jq '.labels[].name'
            )"

            echo "PR labels:"
            printf '%s\n' "$labels"

            if grep -Fxq 'release:none' <<< "$labels"; then
              echo "release:none found; skipping release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if grep -Fxq 'release:major' <<< "$labels"; then
              bump="major"
            elif grep -Fxq 'release:minor' <<< "$labels"; then
              bump="minor"
            else
              bump="patch"
            fi

          # ------------------------------------------------------------
          # Manual release
          # ------------------------------------------------------------
          else
            bump="${MANUAL_BUMP:-patch}"
          fi

          # ------------------------------------------------------------
          # Rerun safety
          #
          # If this exact commit was already tagged by an earlier partial
          # release attempt, reuse that version instead of incrementing.
          # ------------------------------------------------------------
          existing_tag="$(
            git tag \
              --points-at HEAD \
              --sort=-v:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n1 || true
          )"

          if [[ -n "$existing_tag" ]]; then
            echo "HEAD already has release tag ${existing_tag}."
            echo "Reusing existing release version."

            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "version=${existing_tag#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ------------------------------------------------------------
          # Find latest stable semantic-version tag
          # ------------------------------------------------------------
          latest="$(
            git tag --list |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n1 || true
          )"

          if [[ -z "$latest" ]]; then
            latest="v0.0.0"
          fi

          echo "Latest release: ${latest}"
          echo "Requested bump: ${bump}"

          IFS='.' read -r major minor patch <<< "${latest#v}"

          case "$bump" in
            patch)
              patch=$((patch + 1))
              ;;

            minor)
              minor=$((minor + 1))
              patch=0
              ;;

            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;

            *)
              echo "::error::Unknown release bump: ${bump}"
              exit 1
              ;;
          esac

          version="${major}.${minor}.${patch}"
          tag="v${version}"

          # Refuse to overwrite/recreate an existing version.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Release tag ${tag} already exists."
            exit 1
          fi

          echo "Next release: ${tag}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify packaging configuration
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          grep -Fx '## Version: @project-version@' WQATurbo.toc

          grep -Fx 'package-as: WQATurbo' .pkgmeta
          grep -Fx 'externals:' .pkgmeta

          test -f CHANGELOG.md

          grep -Fx 'manual-changelog:' .pkgmeta
          grep -Fx '  filename: CHANGELOG.md' .pkgmeta
          grep -Fx '  markup-type: markdown' .pkgmeta

          # Require release notes for the exact version being released.
          grep -Fx "## ${VERSION}" CHANGELOG.md

          echo "Packaging configuration validated."

      - name: Verify CurseForge configuration
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          CURSEFORGE_PACKAGE_URL: ${{ secrets.CURSEFORGE_PACKAGE_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${CURSEFORGE_PACKAGE_URL:-}" ]]; then
            echo "::error::Repository secret CURSEFORGE_PACKAGE_URL is not configured."
            exit 1
          fi

          echo "CurseForge package trigger is configured."

      - name: Create local release tag
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.create_tag == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "WQA Turbo $VERSION"

          echo "Created local release tag ${TAG}."
          git show --no-patch "$TAG"

      - name: Install packaging dependencies
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -yq subversion zip

      - name: Build release package
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh \
            -o /tmp/wow-packager.sh

          chmod +x /tmp/wow-packager.sh

          env \
            GITHUB_REF="refs/tags/${TAG}" \
            /tmp/wow-packager.sh -d

      - name: Locate release package
        if: steps.version.outputs.skip != 'true'
        id: package
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! -d ".release" ]]; then
            echo "::error::BigWigs Packager did not create .release/"
            exit 1
          fi

          package=".release/WQATurbo-${TAG}.zip"

          if [[ ! -f "$package" ]]; then
            echo "::error::Expected package does not exist: ${package}"
            echo
            echo "Produced files:"
            find .release -maxdepth 2 -type f -print || true
            exit 1
          fi

          echo "Found package: ${package}"
          echo "zip=$package" >> "$GITHUB_OUTPUT"

      - name: Validate embedded libraries
        if: steps.version.outputs.skip != 'true'
        shell: python
        env:
          PACKAGE: ${{ steps.package.outputs.zip }}
        run: |
          import os
          import zipfile
          from pathlib import Path

          package = Path(os.environ["PACKAGE"])

          if not package.is_file():
              raise SystemExit(f"Package does not exist: {package}")

          with zipfile.ZipFile(package) as zf:
              names = set(zf.namelist())

          required = (
              "WQATurbo/WQATurbo.toc",
              "WQATurbo/Libs/AceAddon-3.0/",
              "WQATurbo/Libs/AceConfig-3.0/",
              "WQATurbo/Libs/AceDB-3.0/",
              "WQATurbo/Libs/LibDBIcon-1.0/",
              "WQATurbo/Libs/LibQTip-1.0/",
              "WQATurbo/Libs/LibStub/",
          )

          for item in required:
              if item.endswith("/"):
                  present = any(name.startswith(item) for name in names)
              else:
                  present = item in names

              if not present:
                  raise SystemExit(f"Missing from package: {item}")

          print(f"Validated embedded libraries in {package}")

      - name: Push release tag
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.create_tag == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git push origin "$TAG"

          echo "Published ${TAG}."

      - name: Create or update GitHub Release
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then
            echo "GitHub Release ${TAG} already exists."

            gh release upload \
              "$TAG" \
              "$PACKAGE" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating GitHub Release ${TAG}."

            gh release create \
              "$TAG" \
              "$PACKAGE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "WQA Turbo $VERSION" \
              --generate-notes
          fi

      - name: Trigger CurseForge packaging
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          CURSEFORGE_PACKAGE_URL: ${{ secrets.CURSEFORGE_PACKAGE_URL }}
        run: |
          set -euo pipefail

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            -X POST \
            -d '' \
            "$CURSEFORGE_PACKAGE_URL" \
            >/dev/null

          echo "CurseForge packaging triggered successfully."