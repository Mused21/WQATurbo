name: Automatic release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: wqaturbo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Determine next version
        id: version
        shell: bash
        env:
          MANUAL_BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail

          existing_tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [[ -n "$existing_tag" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "version=${existing_tag#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump="patch"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            bump="${MANUAL_BUMP:-patch}"
          else
            pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty' 2>/dev/null || true)"
            if [[ -n "$pr_number" ]]; then
              labels="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"

              if grep -Fxq 'release:none' <<< "$labels"; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              elif grep -Fxq 'release:major' <<< "$labels"; then
                bump="major"
              elif grep -Fxq 'release:minor' <<< "$labels"; then
                bump="minor"
              fi
            fi
          fi

          latest="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          [[ -n "$latest" ]] || latest="v0.0.0"

          IFS='.' read -r major minor patch <<< "${latest#v}"

          case "$bump" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
          esac

          version="${major}.${minor}.${patch}"
          tag="v${version}"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify packaging config
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx '## Version: @project-version@' WQATurbo.toc
          grep -Fx 'package-as: WQATurbo' .pkgmeta
          grep -Fx 'externals:' .pkgmeta

      - name: Create tag
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.create_tag == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "WQA Turbo $VERSION"
          git push origin "$TAG"

      - name: Build GitHub release package
        if: steps.version.outputs.skip != 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Locate package
        if: steps.version.outputs.skip != 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package="$(find .release -maxdepth 1 -type f -name 'WQATurbo-*.zip' ! -name '*nolib*' | head -n1)"
          [[ -n "$package" ]]
          echo "zip=$package" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$PACKAGE" --repo "$GITHUB_REPOSITORY" --title "WQA Turbo $VERSION" --generate-notes
          fi
